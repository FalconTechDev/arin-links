name: stats
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch counts
        run: node scripts/fetch-stats.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet stats.json; then echo "no change"; exit 0; fi
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git commit -m "stats: update"
          git push
